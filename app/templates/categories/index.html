{% extends "layout.html" %}

{% block content %}

<h2 class="mb-4">Categories</h2>

<div class="card shadow mb-4">
    <div class="card-body">

        <form method="post" action="/categories">

            <div class="row">

                <div class="col-md-5">
                    <input
                        class="form-control"
                        name="name"
                        placeholder="Category Name"
                        required>
                </div>

                <div class="col-md-5">
                    <input
                        class="form-control"
                        name="description"
                        placeholder="Description">
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100">
                        Add
                    </button>
                </div>

            </div>

        </form>

    </div>
</div>

<div class="card shadow">

    <div class="card-body">

        <table class="table table-hover align-middle">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th width="220">Actions</th>
                </tr>
            </thead>

            <tbody>

            {% for category in categories %}

            <tr>

                <td>{{ category.id }}</td>

                <td>{{ category.name }}</td>

                <td>{{ category.description or "" }}</td>

                <td>

                    <div class="d-flex gap-2">

                        <button
                            class="btn btn-success btn-sm"
                            data-bs-toggle="collapse"
                            data-bs-target="#edit{{ category.id }}">
                            Edit
                        </button>

                        <form
                            method="post"
                            action="/categories/{{ category.id }}/delete"
                            onsubmit="return confirm('Delete this category?');">

                            <button
                                class="btn btn-danger btn-sm">
                                Delete
                            </button>

                        </form>

                    </div>

                </td>

            </tr>

            <tr class="collapse" id="edit{{ category.id }}">

                <td colspan="4">

                    <form
                        method="post"
                        action="/categories/{{ category.id }}/edit">

                        <div class="row">

                            <div class="col-md-5">
                                <input
                                    class="form-control"
                                    name="name"
                                    value="{{ category.name }}"
                                    required>
                            </div>

                            <div class="col-md-5">
                                <input
                                    class="form-control"
                                    name="description"
                                    value="{{ category.description or '' }}">
                            </div>

                            <div class="col-md-2">
                                <button class="btn btn-success w-100">
                                    Save
                                </button>
                            </div>

                        </div>

                    </form>

                </td>

            </tr>

            {% else %}

            <tr>

                <td colspan="4" class="text-center py-5">
                    No Categories Found
                </td>

            </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
