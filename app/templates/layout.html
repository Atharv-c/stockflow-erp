<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }} | StockFlow ERP</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>

<body class="bg-light">

    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="/">
                StockFlow ERP
            </a>

        </div>

    </nav>

    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->
            <aside class="col-md-2 bg-dark text-white min-vh-100 p-3">

                <h5 class="mb-4 fw-bold">
                    Menu
                </h5>

                <ul class="nav flex-column">

                    <li class="nav-item mb-2">
                        <a href="/dashboard"
                            class="nav-link sidebar-link {% if request.url.path == '/dashboard' or request.url.path == '/' %}active{% endif %}">

                            <i class="bi bi-speedometer2 me-2"></i>
                            Dashboard

                        </a>

                    </li>

                    <li class="nav-item mb-2">

                        <a href="/products"
                            class="nav-link sidebar-link {% if request.url.path.startswith('/products') %}active{% endif %}">

                            <i class="bi bi-box-seam me-2"></i>
                            Products

                        </a>

                    </li>

                    <li class="nav-item mb-2">

                        <a href="/categories"
                            class="nav-link sidebar-link {% if request.url.path.startswith('/categories') %}active{% endif %}">

                            <i class="bi bi-grid me-2"></i>
                            Categories

                        </a>

                    </li>

                    <li class="nav-item mb-2">

                        <a href="/customers"
                            class="nav-link sidebar-link {% if request.url.path.startswith('/customers') %}active{% endif %}">

                            <i class="bi bi-people me-2"></i>
                            Customers

                        </a>

                    </li>

                    <li class="nav-item mb-2">

                        <a href="/suppliers"
                            class="nav-link sidebar-link {% if request.url.path.startswith('/suppliers') %}active{% endif %}">
                            <i class="bi bi-truck me-2"></i>
                            Suppliers

                        </a>

                    </li>

                    <li class="nav-item mb-2">

                        <a href="/invoices"
                            class="nav-link sidebar-link {% if request.url.path.startswith('/invoices') %}active{% endif %}">

                            <i class="bi bi-receipt-cutoff me-2"></i>
                            Invoices

                        </a>

                    </li>

                    <li class="nav-item mb-2">

                        <a href="/purchases"
                            class="nav-link sidebar-link {% if request.url.path.startswith('/purchases') %}active{% endif %}">
                            <i class="bi bi-cart-check me-2"></i>
                            Purchases

                        </a>

                    </li>

                    <li class="nav-item mb-2">

                        <a href="/reports"
                            class="nav-link sidebar-link {% if request.url.path.startswith('/reports') %}active{% endif %}">
                            <i class="bi bi-bar-chart-line me-2"></i>
                            Reports

                        </a>

                    </li>

                </ul>

            </aside>

            <!-- Main Content -->
            <main class="col-md-10 p-4">

                {% block content %}{% endblock %}

            </main>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', path='js/main.js') }}"></script>

    <script src="/static/js/invoice.js"></script>

</body>

</html>
